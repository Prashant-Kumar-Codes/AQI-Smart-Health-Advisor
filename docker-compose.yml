# ─────────────────────────────────────────────────────────
# AQI Smart Health Advisor — Standalone
# http://<host>:8082
# ─────────────────────────────────────────────────────────

services:
  aqi-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aqi-app
    env_file: .env
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    networks:
      - aqi_net
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"
        reservations:
          memory: 64M

  aqi-nginx:
    image: nginx:1.27-alpine
    container_name: aqi-nginx
    ports:
      - "8082:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      aqi-app:
        condition: service_healthy
    networks:
      - aqi_net
    restart: unless-stopped

networks:
  aqi_net:
    driver: bridge
    name: aqi-network
